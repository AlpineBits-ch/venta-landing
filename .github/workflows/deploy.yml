name: Build and Deploy Angular to Pages

on:
  push:
    branches:
      - main  # Triggers the build whenever you push to main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: ./node_modules/.bin/ng build --configuration production

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/alpine-angular-landing/browser  # Change to your exact Angular output folder
          branch: gh-pages # Deploys the built files to a separate isolated branch
