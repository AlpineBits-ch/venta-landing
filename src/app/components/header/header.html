<!-- Handled in code, not by the href: a bare fragment resolves against
     `<base href="/">` and would navigate off the current route entirely. The
     handler also moves focus, which is the half of a skip link that matters. -->
<a href="#main" (click)="skipToMain($event)"
   class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-brand focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">
  Skip to content
</a>

<header class="fixed inset-x-0 top-0 z-50 transition-colors duration-200"
        [class]="scrolled() ? 'bg-ink/85 backdrop-blur-xl border-b border-line-soft' : ''">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-6 px-5 sm:px-8">

    <a routerLink="/home" class="group flex items-center gap-2.5" (click)="closeMenu()">
      <img src="logo-mark.svg" alt="" width="26" height="26" class="h-[1.625rem] w-[1.625rem]">
      <span class="text-[1.0625rem] font-bold tracking-tight text-text">Venta</span>
      <span class="rounded border border-line px-1.5 py-px font-mono text-[0.625rem] uppercase tracking-[0.14em] text-faint">
        Beta
      </span>
    </a>

    <nav class="ml-auto hidden items-center gap-7 lg:flex">
      <a routerLink="/home" fragment="self-hosting" class="text-sm text-muted transition-colors hover:text-text">Self-hosting</a>
      <a routerLink="/home" fragment="ios" class="flex items-center gap-1.5 text-sm text-muted transition-colors hover:text-text">
        <app-icon name="apple" class="h-3.5 w-3.5" />
        iOS beta
      </a>
      <a routerLink="/roadmap" class="text-sm text-muted transition-colors hover:text-text">Roadmap</a>
      <a routerLink="/blog" class="text-sm text-muted transition-colors hover:text-text">Blog</a>
      <a [href]="docs" target="_blank" rel="noopener noreferrer"
         class="text-sm text-muted transition-colors hover:text-text">Docs</a>
      <a [href]="support" target="_blank" rel="noopener noreferrer"
         class="text-sm text-muted transition-colors hover:text-text">Support</a>
    </nav>

    <div class="ml-auto flex items-center gap-1.5 lg:ml-0">
      <a [href]="github" target="_blank" rel="noopener noreferrer" aria-label="Venta on GitHub"
         class="hidden h-9 w-9 items-center justify-center rounded-lg text-muted transition-colors hover:bg-raised hover:text-text sm:flex">
        <app-icon name="github" class="h-[1.125rem] w-[1.125rem]" />
      </a>
      <a [href]="discord" target="_blank" rel="noopener noreferrer" aria-label="Venta on Discord"
         class="hidden h-9 w-9 items-center justify-center rounded-lg text-muted transition-colors hover:bg-raised hover:text-text sm:flex">
        <app-icon name="discord" class="h-[1.125rem] w-[1.125rem]" />
      </a>

      <a routerLink="/home" fragment="download"
         class="ml-1 rounded-lg bg-brand px-3.5 py-2 text-sm font-semibold text-white transition-colors hover:bg-brand-hover">
        Download
      </a>

      <button type="button"
              (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()"
              aria-controls="mobile-nav"
              [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
              class="ml-1 flex h-9 w-9 items-center justify-center rounded-lg text-muted transition-colors hover:bg-raised hover:text-text lg:hidden">
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" class="h-5 w-5" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-nav" class="border-t border-line-soft bg-ink/95 backdrop-blur-xl lg:hidden">
      <div class="mx-auto flex max-w-6xl flex-col px-5 py-3 sm:px-8">
        <a routerLink="/home" fragment="self-hosting" (click)="closeMenu()"
           class="border-b border-line-soft py-3 text-[0.9375rem] text-muted transition-colors hover:text-text">Self-hosting</a>
        <a routerLink="/home" fragment="ios" (click)="closeMenu()"
           class="flex items-center gap-2 border-b border-line-soft py-3 text-[0.9375rem] text-muted transition-colors hover:text-text">
          <app-icon name="apple" class="h-3.5 w-3.5" /> iOS beta
        </a>
        <a routerLink="/roadmap" (click)="closeMenu()"
           class="border-b border-line-soft py-3 text-[0.9375rem] text-muted transition-colors hover:text-text">Roadmap</a>
        <a routerLink="/blog" (click)="closeMenu()"
           class="border-b border-line-soft py-3 text-[0.9375rem] text-muted transition-colors hover:text-text">Blog</a>
        <a [href]="docs" target="_blank" rel="noopener noreferrer" (click)="closeMenu()"
           class="flex items-center gap-2 border-b border-line-soft py-3 text-[0.9375rem] text-muted transition-colors hover:text-text">
          Docs <app-icon name="externalLink" class="h-3.5 w-3.5 text-faint" />
        </a>
        <a [href]="support" target="_blank" rel="noopener noreferrer" (click)="closeMenu()"
           class="flex items-center gap-2 border-b border-line-soft py-3 text-[0.9375rem] text-muted transition-colors hover:text-text">
          Support <app-icon name="externalLink" class="h-3.5 w-3.5 text-faint" />
        </a>

        <div class="flex gap-2 py-4">
          <a [href]="discord" target="_blank" rel="noopener noreferrer" (click)="closeMenu()"
             class="flex flex-1 items-center justify-center gap-2 rounded-lg border border-line bg-card py-2.5 text-sm font-medium text-text transition-colors hover:bg-raised">
            <app-icon name="discord" class="h-4 w-4" /> Discord
          </a>
          <a [href]="github" target="_blank" rel="noopener noreferrer" (click)="closeMenu()"
             class="flex flex-1 items-center justify-center gap-2 rounded-lg border border-line bg-card py-2.5 text-sm font-medium text-text transition-colors hover:bg-raised">
            <app-icon name="github" class="h-4 w-4" /> GitHub
          </a>
        </div>
      </div>
    </nav>
  }
</header>
